[project]
name = "cat-now-me-api"
version = "1.0.0"
description = "cat-now-me API - AI Development Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.8.0",
    "pydantic-settings==2.3.0",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.0",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "chromadb==0.5.0",
    "pgvector==0.2.5",
    "langchain==0.2.0",
    "langchain-core==0.2.0",
    "langchain-community==0.2.0",
    "langchain-ollama==0.1.0",
    "langgraph==0.1.0",
    "ollama==0.3.0",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "email-validator==2.1.0",
    "structlog==24.1.0",
    "prometheus-client==0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "black==24.4.0",
    "ruff==0.4.0",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "black==24.4.0",
    "ruff==0.4.0",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true